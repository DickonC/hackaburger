# Install: sudo cp nginx-host.conf /etc/nginx/sites-available/hackaburger
#          sudo ln -s /etc/nginx/sites-available/hackaburger /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d hackaburger.cch-uk.tech
server {
    listen 80;
    listen [::]:80;
    server_name hackaburger.cch-uk.tech;

    # arduino-ingest; trailing slash on proxy_pass strips the /ingest prefix
    location /ingest/ {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8094/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
