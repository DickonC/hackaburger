server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate so a new publish shows up straight away
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
