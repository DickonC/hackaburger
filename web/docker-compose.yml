# Serves the frontend at https://hackaburger.cch-uk.tech/ (host nginx proxies / to this).
# Only web/public is served; fill it with ./publish.
services:
  web:
    image: nginx:1.27-alpine
    container_name: hackaburger-web
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8095:80"
